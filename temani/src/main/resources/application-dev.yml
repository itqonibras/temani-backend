spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: temani
  datasource:
    url: ${DATABASE_URL_DEV}
    username: ${DATABASE_USERNAME_DEV}
    password: ${DATABASE_PASSWORD_DEV}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE_DEV:5}
      minimum-idle: ${DB_MIN_IDLE_DEV:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_DEV:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_DEV:60000}
      max-lifetime: ${DB_MAX_LIFETIME_DEV:240000}