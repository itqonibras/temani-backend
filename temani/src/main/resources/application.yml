server:
  port: ${PORT:8080}

spring:
  main:
    allow-circular-references: true
  profiles:
    active: 'dev'
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            "[non_contextual_creation]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:60000}
      max-lifetime: ${DB_MAX_LIFETIME:240000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:20000}

temani:
  app:
    jwtSecret: ${JWT_SECRET_KEY}
    jwtExpirationMs: 86400000
  payment:
    consultationFee: 30000
    midtrans:
      serverKey: ${MIDTRANS_SERVER_KEY}
      clientKey: ${MIDTRANS_CLIENT_KEY}
      merchantId: ${MIDTRANS_MERCHANT_ID}
      isProduction: false
  supabase:
    url: ${SUPABASE_URL}
    anonKey: ${SUPABASE_ANON_KEY}
    serviceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY}
    storage:
      bucket: ${SUPABASE_STORAGE_BUCKET:profile-pictures}
